<!DOCTYPE html>
<html>
<head>
    <title>Lung Cancer Detection</title>
</head>
<body>
    <h1>Lung Cancer Detection</h1>
    <input type="file" id="imageInput" accept="image/*">
    <button onclick="uploadImage()">Predict</button>
    <p id="result"></p>

    <script>
    async function uploadImage() {
        const file = document.getElementById('imageInput').files[0];
        if (!file) {
            alert("Please select an image!");
            return;
        }

        const formData = new FormData();
        formData.append("image", file);

        const response = await fetch("http://127.0.0.1:5000/predict", {
            method: "POST",
            body: formData
        });

        if (!response.ok) {
            document.getElementById("result").innerText = "Error predicting image.";
            return;
        }

        const data = await response.json();
        document.getElementById("result").innerText = "Predicted Class: " + data.predicted_class;
    }
    </script>
</body>
</html>
